{% extends 'base.html' %} {% block content %}
<div class="row justify-content-center mt-4 mb-5">
    <div class="col-md-8 col-lg-7">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Criar Conta</h2>
                    <p class="text-muted">
                        Junte-se à Apollo Shop e garanta seus instrumentos
                    </p>
                </div>

                <form action="{{ url_for('cadastro') }}" method="POST">
                    <div class="mb-3">
                        <label for="nome" class="form-label fw-semibold">Nome Completo</label>
                        <input type="text" class="form-control" id="nome" name="nome"
                            placeholder="Digite seu nome completo" required />
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold">E-mail</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="seu@email.com"
                                required />
                        </div>
                        <div class="col-md-6 mt-3 mt-md-0">
                            <label for="senha" class="form-label fw-semibold">Senha</label>
                            <input type="password" class="form-control" id="senha" name="senha"
                                placeholder="Crie uma senha forte" required />
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="telefone" class="form-label fw-semibold">Telefone</label>
                            <input type="tel" class="form-control" id="telefone" name="telefone"
                                placeholder="(11) 99999-9999" required />
                        </div>
                        <div class="col-md-6 mt-3 mt-md-0">
                            <label for="cidade" class="form-label fw-semibold">Cidade</label>
                            <input type="text" class="form-control" id="cidade" name="cidade" placeholder="Sua cidade"
                                required />
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-2">
                        <button type="submit" class="btn btn-warning btn-lg fw-bold text-dark">
                            Finalizar Cadastro
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p class="mb-0">
                        Já possui uma conta?
                        <a href="{{ url_for('login') }}"
                            class="text-dark fw-bold text-decoration-none border-bottom border-dark">Faça Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
